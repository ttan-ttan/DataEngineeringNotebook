        sections: [
          {

            body: "The Central Processing Unit executes arithmetic and logic operations using clock-synchronized cycles. Memory registers provide ultra-fast temporary storage right on the CPU silicon die, while hardware caches minimize latency when pulling data from RAM."

    // Flattened Topic List for Prev / Next Sequential Navigation
    let flatTopicList = [];
    let currentTopicIndex = 0;

    // Initialize App & Build Tree
    function initApp() {
      buildFlatTopicList();
      renderTree();
      loadTopicByIndex(0);
    }

    // Build Flat Array of Topics
    function buildFlatTopicList() {
      flatTopicList = [];
      handbookData.forEach(part => {
        part.categories.forEach(cat => {
          cat.subcategories.forEach(sub => {
            sub.topics.forEach(top => {
              flatTopicList.push({
                ...top,
                partTitle: part.title,
                catTitle: cat.title,
                subTitle: sub.title
              });
            });
          });
        });
      });
    }

    // Render Multi-Level Collapsible Accordion Tree
    function renderTree() {
      const container = document.getElementById('tree-container');
      container.innerHTML = '';

      handbookData.forEach((part, pIdx) => {
        const partEl = document.createElement('div');
        partEl.className = 'space-y-1';
        partEl.innerHTML = `
                    <button onclick="toggleElement('part-content-${pIdx}', 'part-icon-${pIdx}')" 
                        class="w-full text-left font-bold px-2.5 py-2 rounded-lg bg-slate-900 text-slate-200 border border-slate-800 hover:border-cyan-500/50 hover:text-cyan-400 transition flex items-center justify-between">
                        <span class="truncate">${part.title}</span>
                        <i id="part-icon-${pIdx}" class="fa-solid fa-chevron-down text-[10px] text-cyan-400 transition-transform"></i>
                    </button>
                    <div id="part-content-${pIdx}" class="pl-2 space-y-1 ${pIdx === 0 ? '' : 'hidden'}"></div>
                `;
        container.appendChild(partEl);

        const partContent = document.getElementById(`part-content-${pIdx}`);
        part.categories.forEach((cat, cIdx) => {
          const catEl = document.createElement('div');
          catEl.className = 'space-y-1';
          catEl.innerHTML = `
                        <button onclick="toggleElement('cat-content-${pIdx}-${cIdx}', 'cat-icon-${pIdx}-${cIdx}')" 
                            class="w-full text-left font-medium px-2 py-1.5 rounded bg-slate-950 text-slate-300 hover:text-cyan-300 border border-slate-850 flex items-center justify-between text-[11px]">
                            <span class="truncate">${cat.title}</span>
                            <i id="cat-icon-${pIdx}-${cIdx}" class="fa-solid fa-chevron-down text-[9px] text-slate-500 transition-transform"></i>
                        </button>
                        <div id="cat-content-${pIdx}-${cIdx}" class="pl-2 space-y-1 ${cIdx === 0 && pIdx === 0 ? '' : 'hidden'}"></div>
                    `;
          partContent.appendChild(catEl);

          const catContent = document.getElementById(`cat-content-${pIdx}-${cIdx}`);
          cat.subcategories.forEach((sub, sIdx) => {
            const subEl = document.createElement('div');
            subEl.className = 'space-y-1';
            subEl.innerHTML = `
                            <button onclick="toggleElement('sub-content-${pIdx}-${cIdx}-${sIdx}', 'sub-icon-${pIdx}-${cIdx}-${sIdx}')" 
                                class="w-full text-left px-2 py-1 rounded text-[11px] text-slate-400 hover:text-emerald-400 flex items-center justify-between font-mono">
                                <span class="truncate">${sub.title}</span>
                                <i id="sub-icon-${pIdx}-${cIdx}-${sIdx}" class="fa-solid fa-chevron-down text-[8px] text-slate-600 transition-transform"></i>
                            </button>
                            <div id="sub-content-${pIdx}-${cIdx}-${sIdx}" class="pl-2 space-y-0.5 border-l border-slate-800 ${sIdx === 0 && cIdx === 0 && pIdx === 0 ? '' : 'hidden'}"></div>
                        `;
            catContent.appendChild(subEl);

            const subContent = document.getElementById(`sub-content-${pIdx}-${cIdx}-${sIdx}`);
            sub.topics.forEach(top => {
              const topIdx = flatTopicList.findIndex(t => t.id === top.id);
              const topBtn = document.createElement('button');
              topBtn.id = `btn-topic-${top.id}`;
              topBtn.onclick = () => loadTopicByIndex(topIdx);
              topBtn.className = `w-full text-left px-2 py-1 rounded text-[11px] font-mono transition block truncate text-slate-400 hover:text-cyan-400 hover:bg-slate-900`;

    // Toggle Expand / Collapse
    function toggleElement(contentId, iconId) {
      const content = document.getElementById(contentId);
      const icon = document.getElementById(iconId);
      if (content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        if (icon) icon.style.transform = 'rotate(180deg)';
      } else {
        content.classList.add('hidden');
        if (icon) icon.style.transform = 'rotate(0deg)';
      }
    }

    // Toggle Sidebar Auto-Hide
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      if (sidebar.classList.contains('-translate-x-full') || sidebar.classList.contains('hidden')) {
        sidebar.classList.remove('-translate-x-full', 'hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        setTimeout(() => sidebar.classList.add('hidden'), 300);
      }
    }

    // Load Topic Content by Flat Index
    function loadTopicByIndex(index) {
      if (index < 0 || index >= flatTopicList.length) return;
      currentTopicIndex = index;
      const topic = flatTopicList[index];
      const data = topicContents[topic.contentId] || {
        title: topic.title,
        level: "Standard Level",
        summary: "Technical overview and system specifications.",
        mermaid: "graph TD
NodeA[Topic Component] -- > NodeB[Execution Flow]",
      sections: [{ heading: "Module Details", body: "Content under development." }]
    };

    // Highlight Active Topic in Sidebar
    flatTopicList.forEach(t => {
      const btn = document.getElementById(`btn-topic-${t.id}`);
      if (btn) {
        btn.classList.remove('text-cyan-400', 'bg-slate-900', 'font-bold', 'border-l-2', 'border-cyan-400');
        btn.classList.add('text-slate-400');
      }
    });
    const activeBtn = document.getElementById(`btn-topic-${topic.id}`);
    if (activeBtn) {
      activeBtn.classList.add('text-cyan-400', 'bg-slate-900', 'font-bold', 'border-l-2', 'border-cyan-400');
      activeBtn.classList.remove('text-slate-400');
    }

    // Update Breadcrumb & Header
    document.getElementById('breadcrumb').innerHTML = `
                <span class="text-cyan-400 font-bold">${topic.partTitle.split(':')[0]}</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
                <span>${topic.catTitle}</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
                <span class="text-slate-200">${topic.title}</span>
            `;
    document.getElementById('current-topic-title').innerText = topic.title;

    // Render Main Content HTML
    const renderArea = document.getElementById('topic-render-area');
    renderArea.innerHTML = `
                <div id="exportable-area" class="reading-card-primary rounded-xl p-6 neon-border-blue space-y-6">
                    <!-- Title Header -->
                    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                        <div>
                            <span class="text-xs font-mono text-emerald-400 bg-emerald-950/90 px-2.5 py-1 rounded border border-emerald-500/40">${data.level}</span>
                            <h1 class="text-xl font-extrabold text-white mt-2 tracking-wide">${data.title}</h1>
                            <p class="text-xs text-slate-300 mt-1 leading-relaxed">${data.summary}</p>
                        </div>
                    </div>

                    <!-- Visual Workflow Diagram -->
                    <div class="bg-slate-950 p-4 rounded-lg border border-slate-800">
                        <div class="text-[11px] font-mono text-cyan-400 mb-2 flex items-center space-x-1.5">
                            <i class="fa-solid fa-diagram-project text-xs"></i>
                            <span>SYSTEM EXECUTION DIAGRAM (MERMAID.JS)</span>
                        </div>
                        <div class="mermaid">${data.mermaid}</div>
                    </div>

                    <!-- Detailed Content Sections -->
                    <div class="space-y-4">
                        ${data.sections.map(sec => `
                            <div class="reading-card-secondary p-4 rounded-lg space-y-2">
                                <h3 class="font-bold text-sm text-cyan-300 flex items-center space-x-2">
                                    <i class="fa-solid fa-layer-group text-xs text-cyan-400"></i>
                                    <span>${sec.heading}</span>
                                </h3>
                                <p class="text-xs text-slate-300 leading-relaxed">${sec.body}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

    // Re-render Mermaid Diagrams
    setTimeout(() => {
      mermaid.contentLoaded();
    }, 100);

    // Update Navigation Buttons & Labels
    updateNavButtons();
        }

    // Update Prev / Next Button States
    function updateNavButtons() {
      const hasPrev = currentTopicIndex > 0;
      const hasNext = currentTopicIndex < flatTopicList.length - 1;

      document.getElementById('btn-prev').disabled = !hasPrev;
      document.getElementById('btn-next').disabled = !hasNext;
      document.getElementById('btn-prev-bottom').disabled = !hasPrev;
      document.getElementById('btn-next-bottom').disabled = !hasNext;

      document.getElementById('btn-prev').classList.toggle('opacity-50', !hasPrev);
      document.getElementById('btn-next').classList.toggle('opacity-50', !hasNext);
      document.getElementById('btn-prev-bottom').classList.toggle('opacity-50', !hasPrev);
      document.getElementById('btn-next-bottom').classList.toggle('opacity-50', !hasNext);

      if (hasPrev) {
        document.getElementById('prev-topic-label').innerText = `Prev: ${flatTopicList[currentTopicIndex - 1].title}`;
      } else {
        document.getElementById('prev-topic-label').innerText = "Start of Handbook";
      }

      if (hasNext) {
        document.getElementById('next-topic-label').innerText = `Next: ${flatTopicList[currentTopicIndex + 1].title}`;
      } else {
        document.getElementById('next-topic-label').innerText = "End of Handbook";
      }
    }

    // Navigate Sequential Topics
    function navigateTopic(direction) {
      loadTopicByIndex(currentTopicIndex + direction);
    }

    // Filter Tree Items by Search Query
    function filterTree(query) {
      const q = query.toLowerCase();
      flatTopicList.forEach(top => {
        const btn = document.getElementById(`btn-topic-${top.id}`);
        if (btn) {
          if (top.title.toLowerCase().includes(q) || top.catTitle.toLowerCase().includes(q)) {
            btn.classList.remove('hidden');
          } else {
            btn.classList.add('hidden');
          }
        }
      });
    }

    // Export Active Topic Content to PDF
    function exportToPDF() {
      const element = document.getElementById('exportable-area');
      const opt = {
        margin: 0.5,
        filename: `${flatTopicList[currentTopicIndex].title}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    // Export Active Topic Content to Word (.docx)
    function exportToWord() {
      const topic = flatTopicList[currentTopicIndex];
      const data = topicContents[topic.contentId] || { title: topic.title, summary: "", sections: [] };

      const doc = new docx.Document({
        sections: [{
          properties: {},
          children: [
            new docx.Paragraph({
              children: [new docx.TextRun({ text: "TTAN DE HANDBOOK HUB", bold: true, size: 28, color: "00F3FF" })]
            }),
            new docx.Paragraph({
              children: [new docx.TextRun({ text: data.title, bold: true, size: 24 })]
            }),
            new docx.Paragraph({
              children: [new docx.TextRun({ text: `Level: ${data.level || 'Standard'}`, italics: true, size: 20 })]
            }),
            new docx.Paragraph({ text: "" }),
            new docx.Paragraph({
              children: [new docx.TextRun({ text: "Summary: ", bold: true }), new docx.TextRun(data.summary)]
            }),
            new docx.Paragraph({ text: "" }),
            ...data.sections.flatMap(sec => [
              new docx.Paragraph({
                children: [new docx.TextRun({ text: sec.heading, bold: true, size: 22, color: "0284C7" })]
              }),
              new docx.Paragraph({
                children: [new docx.TextRun(sec.body)]
              }),
              new docx.Paragraph({ text: "" })
            ])
          ]
        }]
      });

      docx.Packer.toBlob(doc).then(blob => {
        saveAs(blob, `${topic.title}.docx`);
      });
    }

    // Initialize on DOM Ready
    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>

</html>
